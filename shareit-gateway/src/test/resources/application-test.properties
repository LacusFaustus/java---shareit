# Test Configuration for Gateway
server.port=8080
spring.application.name=shareit-gateway-test

# Server URL for tests
shareit.server.url=http://localhost:9090

# Enable caching for tests
spring.cache.type=caffeine
spring.cache.cache-names=items,users,bookings,itemRequests
spring.cache.caffeine.spec=maximumSize=100,expireAfterAccess=60s

# Resilience4j configuration
resilience4j.circuitbreaker.enabled=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.shareItServer.base-config=default

resilience4j.retry.enabled=false
resilience4j.bulkhead.enabled=false

# Disable auto-configurations
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Enable bean overriding
spring.main.allow-bean-definition-overriding=true

# Logging
logging.level.ru.practicum.shareit=DEBUG
logging.level.org.springframework=WARN
logging.level.io.github.resilience4j=WARN

# Disable banner
spring.main.banner-mode=off

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always
