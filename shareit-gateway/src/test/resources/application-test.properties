# Test Configuration for Gateway
server.port=8080
spring.application.name=shareit-gateway-test

# Server URL for tests (??????????????, ????? ?? ?????)
shareit.server.url=http://localhost:9999

# Disable everything that might cause conflicts
spring.cache.type=none
resilience4j.circuitbreaker.enabled=false
resilience4j.retry.enabled=false
resilience4j.bulkhead.enabled=false

# Disable all auto-configurations that might cause issues
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# Enable bean overriding
spring.main.allow-bean-definition-overriding=true

# Disable logging to reduce noise
logging.level.root=WARN
logging.level.ru.practicum.shareit=WARN
logging.level.org.springframework=WARN

# Disable banner
spring.main.banner-mode=off
