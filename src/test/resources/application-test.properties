# ============================================
# ShareIt Test Configuration
# Profile: test
# ============================================

# Application Settings
server.port=0
spring.application.name=shareit-test

# Database Configuration - H2 in-memory
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.open-in-view=false

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# Disable H2 console
spring.h2.console.enabled=false

# Logging
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR
logging.level.ru.practicum.shareit=INFO

# Test-specific Settings
spring.main.allow-bean-definition-overriding=true
spring.main.lazy-initialization=true
spring.main.banner-mode=off

# Disable schema validation during tests
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# Web Application Type (NONE for non-web tests)
spring.main.web-application-type=none

# Disable unnecessary auto-configurations
spring.autoconfigure.exclude=
org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,
org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,
org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration

# Disable flyway/liquibase
spring.flyway.enabled=false
spring.liquibase.enabled=false

# Disable scheduled tasks
spring.task.scheduling.enabled=false

# Disable async processing
spring.task.execution.enabled=false

# Disable Actuator
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=false

# Test HTTP client settings
spring.webclient.response-timeout=10s

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
