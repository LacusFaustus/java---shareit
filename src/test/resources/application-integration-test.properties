# ============================================
# ShareIt Integration Test Configuration
# Profile: integration-test
# For integration tests with real PostgreSQL database
# ============================================

# Application Settings for Integration Tests
server.port=8081  # Different port to avoid conflicts
spring.application.name=shareit-integration-test

# PostgreSQL Database Configuration for Integration Tests
# These should match your test PostgreSQL instance
spring.datasource.url=jdbc:postgresql://localhost:5432/shareit_integration_test
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# Connection Pool Settings for Integration Tests
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.pool-name=IntegrationTestPool

# JPA/Hibernate Configuration for PostgreSQL Integration Tests
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop  # Drop and recreate for clean tests
spring.jpa.show-sql=true  # Show SQL for debugging integration tests
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false
spring.jpa.generate-ddl=true

# SQL Initialization for Integration Tests
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-integration-test.sql
spring.sql.init.data-locations=classpath:data-integration-test.sql
spring.sql.init.continue-on-error=false  # Fail on error in integration tests

# Disable H2 completely for integration tests
spring.h2.console.enabled=false

# Logging Configuration for Integration Tests
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.stat=DEBUG
logging.level.ru.practicum.shareit=DEBUG
logging.level.ru.practicum.shareit.service=TRACE
logging.level.ru.practicum.shareit.repository=DEBUG
logging.level.ru.practicum.shareit.controller=DEBUG

# Log file configuration
logging.file.name=./logs/integration-test.log
logging.file.max-size=10MB
logging.file.max-history=5
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Spring Boot Settings for Integration Tests
spring.main.allow-bean-definition-overriding=true
spring.main.lazy-initialization=false  # Disable lazy init for integration tests
spring.main.banner-mode=off

# Validation Settings
spring.jpa.properties.hibernate.validator.apply_to_ddl=true
spring.jpa.properties.javax.persistence.validation.mode=AUTO

# Jackson (JSON) Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.default-view-inclusion=true
spring.jackson.time-zone=UTC

# Web/MVC Settings for Integration Tests
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd'T'HH:mm:ss
spring.mvc.format.time=HH:mm:ss
spring.mvc.throw-exception-if-no-handler-found=true
spring.mvc.static-path-pattern=/static/**
spring.web.resources.add-mappings=true

# Transaction Management for Integration Tests
spring.transaction.default-timeout=30s
spring.transaction.rollback-on-commit-failure=true
spring.jpa.open-in-view=false

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=items,users,bookings
spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=600s

# Test HTTP Settings
server.servlet.session.timeout=30m
server.servlet.session.persistent=true
server.servlet.session.tracking-modes=cookie
server.servlet.context-path=/

# HTTP Client Settings for Integration Tests
spring.webclient.connect-timeout=10s
spring.webclient.response-timeout=30s
spring.rest-template.connect-timeout=10000
spring.rest-template.read-timeout=30000

# Enable scheduled tasks for integration tests
spring.task.scheduling.enabled=true
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=integration-test-

# Async processing for integration tests
spring.task.execution.enabled=true

# Test mail settings (mock)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.test-connection=true

# Actuator endpoints for integration tests
management.endpoints.enabled-by-default=true
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=false
management.metrics.export.simple.enabled=true
management.metrics.export.simple.step=30s
management.endpoints.web.exposure.include=health,info,metrics

# Health check settings
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.defaults.enabled=true

# Metrics settings
management.metrics.enable.all=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=100ms,200ms,500ms,1s,2s

# Database connection validation
spring.datasource.validation-query=SELECT 1
spring.datasource.test-on-borrow=true
spring.datasource.test-while-idle=true
spring.datasource.time-between-eviction-runs-millis=60000
spring.datasource.min-evictable-idle-time-millis=300000

# Flyway/Liquibase disabled (using Spring SQL init)
spring.flyway.enabled=false
spring.liquibase.enabled=false

# Test security (basic for integration tests)
spring.security.enabled=true
spring.security.user.name=testuser
spring.security.user.password=testpass
spring.security.user.roles=USER,ADMIN

# CSRF disabled for API testing
spring.security.csrf.enabled=false

# CORS configuration for integration tests
spring.mvc.cors.enabled=true
spring.mvc.cors.allowed-origins=http://localhost:3000,http://localhost:8081
spring.mvc.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true
spring.mvc.cors.max-age=3600

# Test file upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=0

# Test rate limiting (disabled)
spring.ratelimiter.enabled=false

# Test circuit breaker (disabled)
spring.cloud.circuitbreaker.enabled=false

# Test messaging (disabled)
spring.jms.enabled=false
spring.kafka.enabled=false
spring.rabbitmq.enabled=false

# Test websocket (disabled)
spring.websocket.enabled=false

# Test GraphQL (disabled)
spring.graphql.enabled=false

# Test gRPC (disabled)
spring.cloud.grpc.enabled=false

# Test monitoring (basic)
spring.boot.admin.client.enabled=false

# Test distributed tracing (disabled)
spring.sleuth.enabled=false

# Test feature flags
spring.cloud.feature.enabled=false

# Test database migration rollback
spring.test.database.replace=none
spring.test.database.connection=embedded

# Integration test specific properties
integration.test.timeout.seconds=120
integration.test.cleanup.enabled=true
integration.test.data.reset=true
integration.test.parallel.execution=false

# Test email verification (mock)
test.email.verification.enabled=false
test.email.smtp.mock.port=1025

# Test file storage (temporary)
test.file.storage.path=./temp/integration-test-files/
test.file.storage.cleanup.enabled=true
test.file.storage.max-age.hours=24

# Test API versioning
api.version=v1
api.base-path=/api/${api.version}
